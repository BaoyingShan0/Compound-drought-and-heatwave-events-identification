[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compound-dhw"
version = "0.1.0"
description = "Daily drought/heatwave and compound event identification (Python)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Baoying Shan", email = "baoying.shan@polimi.it"}]
keywords = ["drought", "heatwave", "compound events", "climate", "extreme events"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "bottleneck>=1.3; platform_machine != 'arm64' or sys_platform != 'darwin'",
]

[project.optional-dependencies]
full = [
    "numba>=0.58",
    "xarray>=2023.7",
    "pymannkendall>=1.4",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/BaoyingShan0/Compound-drought-and-heatwave-events-identification"
Repository = "https://github.com/BaoyingShan0/Compound-drought-and-heatwave-events-identification"
Documentation = "https://github.com/BaoyingShan0/Compound-drought-and-heatwave-events-identification#readme"
"Bug Tracker" = "https://github.com/BaoyingShan0/Compound-drought-and-heatwave-events-identification/issues"
"Paper" = "https://doi.org/10.5194/hess-28-2065-2024"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["Shan_daily*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
